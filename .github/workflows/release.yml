name: Release

# Never on a tag push: tags get moved and force-pushed, and a publish cannot be undone.
on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  stage:
    environment: release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      # Staged publishing needs npm 11.15 or newer.
      - run: npm install -g npm@latest

      - run: pnpm install --frozen-lockfile
      - run: pnpm test

      # pnpm packs so `workspace:*` becomes the real version. npm holds the OIDC
      # exchange, and stages from the unpacked copy — scripts are skipped because the
      # tarball carries no sources to build from.
      - run: pnpm --filter @frontit/core pack --pack-destination .
      - run: pnpm --filter frontit pack --pack-destination .

      - name: Show what will be staged
        run: |
          for tarball in *.tgz; do
            echo "::group::$tarball"
            tar tzf "$tarball"
            tar xzOf "$tarball" package/package.json
            echo "::endgroup::"
          done

      - name: Stage @frontit/core
        run: |
          mkdir -p staging/core && tar xzf frontit-core-*.tgz -C staging/core
          cd staging/core/package && npm stage publish --ignore-scripts --access public

      - name: Stage frontit
        run: |
          mkdir -p staging/umbrella && tar xzf frontit-[0-9]*.tgz -C staging/umbrella
          cd staging/umbrella/package && npm stage publish --ignore-scripts --access public

      - name: How to approve
        run: |
          echo "Staged, not live. Review and promote from a terminal with 2FA:"
          echo "  npm stage list"
          echo "  npm stage download <stage-id>   # inspect the actual tarball"
          echo "  npm stage approve <stage-id>    # @frontit/core first"
